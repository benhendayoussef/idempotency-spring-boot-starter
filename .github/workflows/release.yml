name: Release

# Tag-triggered only - never runs on a plain push or PR. Pushing a tag matching v* (e.g. v0.1.0,
# or v0.0.1 for a throwaway pipeline smoke test) is the only way to trigger this.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew -Pversion=${{ env.RELEASE_VERSION }} clean build

      # Uploads and validates the deployment on the Central Portal but does not auto-release it:
      # deliberately publishToMavenCentral rather than publishAndReleaseToMavenCentral, so that
      # reviewing the Deployment card and clicking Publish stays a manual, irreversible-by-choice
      # step rather than something a pushed tag does on its own.
      - name: Publish to Maven Central (upload + validate only)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
        run: ./gradlew -Pversion=${{ env.RELEASE_VERSION }} publishToMavenCentral --no-configuration-cache
